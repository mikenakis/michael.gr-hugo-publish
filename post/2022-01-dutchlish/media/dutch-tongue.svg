<svg:svg width="1620" height="1000" viewBox="0 0 1620 1000" version="1.1" id="svg1" xmlns="http://www.w3.org/2000/svg" xmlns:svg="http://www.w3.org/2000/svg">
  
  <svg:defs id="defs1">
    <!-- The three stripe gradients share one centre, focus and radius, so that the highlight and the shading continue seamlessly across the stripes.
    The white and blue stripes lie away from the focus, which falls in the red stripe, so their stops are pushed outwards to give each a visible highlight of its own. -->
    <svg:radialGradient id="tongue-red-shading" gradientUnits="userSpaceOnUse" cx="28" cy="60" r="50" fx="18" fy="50">
      <svg:stop offset="0" style="stop-color:#e25a63" />
      <svg:stop offset="0.4" style="stop-color:#ae1c28" />
      <svg:stop offset="1" style="stop-color:#6e0f17" />
    </svg:radialGradient>
    <svg:radialGradient id="tongue-white-shading" gradientUnits="userSpaceOnUse" cx="28" cy="60" r="50" fx="18" fy="50">
      <svg:stop offset="0" style="stop-color:#ffffff" />
      <svg:stop offset="0.3" style="stop-color:#ffffff" />
      <svg:stop offset="0.55" style="stop-color:#c3c6cd" />
      <svg:stop offset="1" style="stop-color:#6c717d" />
    </svg:radialGradient>
    <svg:radialGradient id="tongue-blue-shading" gradientUnits="userSpaceOnUse" cx="28" cy="60" r="50" fx="18" fy="50">
      <svg:stop offset="0.35" style="stop-color:#6a90d6" />
      <svg:stop offset="0.65" style="stop-color:#21468b" />
      <svg:stop offset="1" style="stop-color:#0d1f45" />
    </svg:radialGradient>
  </svg:defs>
