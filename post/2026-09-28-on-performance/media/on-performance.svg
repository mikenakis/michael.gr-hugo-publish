  <svg:title id="title1">Three retro rockets racing cover concept, revised fins</svg:title>
  <svg:desc id="desc1">Three differently shaped retro rockets fly left to right along straight horizontal paths with white trapezoidal fins, each leaving a straight trail in its own color.</svg:desc>
